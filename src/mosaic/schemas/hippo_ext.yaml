id: https://w3id.org/hippo/hippo_ext
name: hippo_ext
title: Hippo Annotation Extension Vocabulary
description: >-
  Formal declaration of the hippo_* annotations consumed by Hippo's schema
  pipeline, DDL generators, validators, and typed client. Every hippo_*
  annotation used in any Hippo-managed schema MUST be declared here.
  See sec9 §9.4 of the Hippo design spec for the rationale.

  Modeling note: LinkML has no native metamodel for declaring a vocabulary
  of allowed annotation tags. This schema represents each hippo_*
  annotation as a `slot` — repurposing LinkML's slot declaration as the
  most natural container for (range, description, default, applicability).
  The `in_subset` assignment (`class_annotation` or `slot_annotation`)
  encodes the `applies_to` target. SchemaRegistry loads this schema as
  its annotation-validation authority; user schemas do not import these
  slots as data slots.

license: https://creativecommons.org/publicdomain/zero/1.0/
version: 0.4.0

prefixes:
  linkml: https://w3id.org/linkml/
  hippo: https://w3id.org/hippo/
default_prefix: hippo
default_range: string

imports:
  - linkml:types

#
# Subsets encode the applies_to constraint:
#   class_annotation — may attach to a class
#   slot_annotation  — may attach to a slot
#
subsets:
  class_annotation:
    description: Annotations that may attach to a class definition.
  slot_annotation:
    description: Annotations that may attach to a slot definition.

#
# Annotation declarations — one slot per hippo_* annotation.
#
slots:

  hippo_unique:
    description: >-
      Emit a single-column UNIQUE constraint for this slot at the
      storage layer. For composite uniqueness across multiple slots,
      use LinkML's native `unique_keys` on the class instead.
    range: boolean
    ifabsent: "false"
    in_subset:
      - slot_annotation

  hippo_index:
    description: >-
      Emit a single-column index for this slot. Adapters honor this
      annotation via their DDL shim; see sec9 §9.10.
    range: boolean
    ifabsent: "false"
    in_subset:
      - slot_annotation

  hippo_index_partial:
    description: >-
      When `hippo_index: true`, emit the index as partial with
      `WHERE is_available = 1`. Has no effect unless `hippo_index` is
      true on the same slot.
    range: boolean
    ifabsent: "false"
    in_subset:
      - slot_annotation

  hippo_search:
    description: >-
      Include this slot in a full-text search index of the declared
      mode. The mode value is a free-form string — the adapter is the
      authority on which modes it supports and MUST fail at startup with
      a clear error when it cannot serve the requested mode. Schema-level
      validation does not constrain the value (different adapters may
      support different modes; per sec9 §9.10, schemas declare intent
      and adapters enforce capability). Current canonical mode: `fts5`
      (SQLite FTS5).
    range: string
    in_subset:
      - slot_annotation

  hippo_external_xref:
    description: >-
      Mark an `ExternalReference`-ranged slot as a reverse-lookup key.
      The annotated slot's `(system, value)` pairs are maintained in the
      adapter's `hippo_xref_index` side table on every entity write
      (create / update / replace / availability transition) in the same
      transaction as the entity write — the same annotation-driven
      side-table pattern as `hippo_search`. The index enforces global
      uniqueness of `(system, value)` among AVAILABLE entities (index
      rows exist only for `is_available = 1` rows, mirroring the
      `hippo_unique` partial-index semantics from PTS-348) and serves
      `HippoClient.find_by_xref(system, value)` / `GET /xref/{system}/
      {value}` reverse lookups. Only valid on slots whose range is the
      `ExternalReference` value type (single- or multivalued); the DDL
      generator fails at startup otherwise. A slot can hold an
      `ExternalReference` without this annotation — it then carries the
      structured value but is not a lookup key and is not
      uniqueness-constrained.
    range: boolean
    ifabsent: "false"
    in_subset:
      - slot_annotation

  hippo_append_only:
    description: >-
      Storage adapter MUST reject UPDATE and DELETE against rows of the
      annotated class — only INSERT is permitted. Used by
      `ProvenanceRecord` (see sec9 §9.6) and any caller-declared
      log-shaped entity. Enforcement is a runtime check in the adapter;
      LinkML annotations declare intent, adapters honor it. A violation
      is a defect in the adapter, not in the schema.

      Note: `provenance-as-linkml-class` (Wave 2) declares this
      annotation and applies it to `ProvenanceRecord`. The concrete
      adapter-side enforcement lands with the subsequent
      `provenance-migration` change that restructures the provenance
      storage; until then, append-only semantics for the legacy
      `provenance` table are implicit (ProvenanceStore only INSERTs).
    range: boolean
    ifabsent: "false"
    in_subset:
      - class_annotation

  hippo_accessor:
    description: >-
      Override the typed client's accessor name for this class, and the
      synthesized tree-root slot name used by `hippo validate` / `hippo
      ingest`. By default both surfaces use `snake_case(ClassName) + "s"`
      — e.g. `Sample` → `client.samples` and `samples:` in the YAML
      bundle; `TissueType` → `client.tissue_types`. Deployments set
      `hippo_accessor` when the default derivation collides with another
      class in the same namespace, collides with an SDK-reserved name,
      or produces an awkward plural (`Process` → `processs`, `analyses`
      vs. `analysises`). The value is the desired accessor string; it
      must be a valid Python identifier and must not collide with another
      accessor or sub-namespace segment in the same namespace. See sec9
      §9.8 Decision 9.8.B and sec9 PR 3.1 (β-handoff) for the tree-root
      coupling.
    range: string
    in_subset:
      - class_annotation

  hippo_anchor:
    description: >-
      Whether this class may be queried as a collection of its own (ADR-0014
      Decision 5). Default true. On a family — an abstract class with exposed
      concrete kinds — `false` removes its read-only accessor, `<Class>Page`,
      filter input and `search{Plural}`, and QuerySpec answers it with
      UNKNOWN_ANCHOR; its GraphQL interface and the resolution of references
      ranged on it are unaffected. On a concrete class it removes only
      QuerySpec anchoring. Use it on a root class whose collection is the
      whole graph (e.g. `NamedThing`).
    range: boolean
    ifabsent: "true"
    in_subset:
      - class_annotation

  hippo_manifest:
    description: >-
      Whether this class is listed in the planner-facing capability manifest
      (`mosaic://capabilities`; ADR-0014 Decision 5). Default true. `false`
      hides the class from the planner — it is not offered as an anchor, not
      named as any entry's `parent`, and a reference ranged on it reports
      `predicate: false` — without removing it from GraphQL or the SDK.
    range: boolean
    ifabsent: "true"
    in_subset:
      - class_annotation

  hippo_namespace:
    description: >-
      Declare the namespace this class belongs to for typed-client
      access. Value is a literal string; dots are organizational
      convention (e.g. `assay.quant` produces nested attributes
      `client.assay.quant`). Absent annotation means the class is in
      the root namespace (reachable as `client.<accessor>` and
      `client.root.<accessor>`). `root` is a reserved namespace name
      and MUST NOT appear as a value of this annotation. See sec9 §9.8
      and Decision 9.8.F.
    range: string
    in_subset:
      - class_annotation
