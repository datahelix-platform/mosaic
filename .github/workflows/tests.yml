name: Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mosaic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install from uv.lock so CI tests the same versions as `uv run pytest`
      # and the image (mosaic#242). Upstream drift is caught by the weekly
      # unlocked run in tests-unlocked.yml.
      - name: Install dependencies (locked)
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev --extra graphql --extra mcp

      - name: Show resolved linkml versions
        run: uv run --no-sync python -c "import importlib.metadata as m; print('linkml', m.version('linkml'), '| linkml-runtime', m.version('linkml-runtime'))"

      - name: Run tests (SQLite)
        run: uv run --no-sync pytest -v --ignore=tests/integration/test_postgres_adapter.py

  mosaic-postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hippo_test
          POSTGRES_PASSWORD: hippo_test
          POSTGRES_DB: hippo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hippo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev --extra postgres

      - name: Run PostgreSQL integration tests
        env:
          MOSAIC_DATABASE_URL: postgresql://hippo_test:hippo_test@localhost:5432/hippo_test
        run: uv run --no-sync pytest tests/integration -k postgres -v
