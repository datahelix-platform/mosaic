id: https://example.org/mosaic/test/sample
name: sample_schema
description: Minimal LinkML schema exercising Hippo-relevant features.

prefixes:
  linkml: https://w3id.org/linkml/

imports:
  - linkml:types
  - mosaic_core

default_range: string

classes:
  Project:
    is_a: Entity
    attributes:
      name:
        required: true
        annotations:
          mosaic_search: fts5
      description:
        annotations:
          mosaic_search: fts5
      samples:
        range: Sample
        multivalued: true
        inverse: project_id      # virtual reverse edge (ADR-0011)

  Sample:
    is_a: Entity
    attributes:
      name:
        required: true
        annotations:
          mosaic_search: fts5
      project_id:
        range: Project
        annotations:
          mosaic_index: true
      collected_at:
        range: datetime
        annotations:
          mosaic_index: true
          mosaic_index_partial: true
      status:
        range: SampleStatus
      volume_ml:
        range: float

enums:
  SampleStatus:
    permissible_values:
      active:
      archived:
      distributed:
